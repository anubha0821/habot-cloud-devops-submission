name: Poka-Yoke Fail-Closed Build Gate

on:
    pull-request:
    push:
        branchs: ["master"]
    permissions:
          contents: read
          actions: read
          security-events: write
    concurrency:
        group: staging-build-gate-${{ github.ref }}
        cancel-in-progress: true
    jobs:
        fail-closed-gate:
            name: formatting-security-validation
            runs-on: ubuntu-latest
            timeouts-minutes: 20
        steps:
            - name: checkout source
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"
                cache: "pip"
            
            - name: Install validation dependencies
              run: python -m pip install -r requirements-dev.txt